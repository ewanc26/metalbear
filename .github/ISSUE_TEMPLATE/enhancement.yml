# Canonical in ewanc26/metalbear; drift-checked in every repo (tools/repo_sync.py forms check).
name: Enhancement
description: A new capability or a change in behaviour I want.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'Write this in the first person, as the owner: "I''ve found...", "I want...", not "This issue tracks...". If Claude is writing it, the last line is exactly `_Written by Claude on my behalf._`.
      Security problems never go here: use the private advisory link on the new-issue page.'
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Which `area:` label fits. Pick more than one if it spans areas.
    multiple: true
    options:
      # areas:begin (generated from .github/labels.yml; per-repo)
      - atproto
      - auth
      - build
      - ci
      - docs
      - infra
      - ui
      - input
      - storage
      - network
      - media
      - update
      # areas:end
  validations:
    required: true
- type: textarea
  id: want
  attributes:
    label: What I want
    description: The capability, and who it is for.
  validations:
    required: true
- type: textarea
  id: why
  attributes:
    label: Why
    description: The problem it solves, or what it unblocks.
  validations:
    required: true
- type: textarea
  id: shape
  attributes:
    label: Shape
    description: API sketch, wire format, or the spec or lexicon it follows.
  validations:
    required: false
