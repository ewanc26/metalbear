global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: metalbear
    metrics_path: /metrics
    # The admin password is read from a host file mounted read-only by Compose;
    # never put it in this config or in the repository.
    basic_auth:
      username: admin
      password_file: /etc/prometheus/metrics-password
    static_configs:
      - targets: ['127.0.0.1:2583']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
