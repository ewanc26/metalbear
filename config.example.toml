# MetalBear configuration.
#
# Every value here can also be set as an environment variable, and the
# environment wins. That lets a checked-in file hold the shape of a deployment
# while secrets and per-host overrides stay outside it.
#
# Load order: ./config.toml, or the path in METALBEAR_CONFIG.
# Any setting left out keeps its default; unknown settings are an error rather
# than silently ignored.

[server]
listen        = "127.0.0.1"          # bind address; put TLS in front
port          = 2583
threads       = 4                    # request worker threads
data          = "data"               # data directory
service_did   = "did:web:pds.example.com"
public_url    = "https://pds.example.com"   # derived from a did:web service DID if omitted
user_domain   = ".pds.example.com"   # suffix accounts may register handles under
# contact_email = "admin@example.com"
# lexicon_dir  = "/usr/local/share/metalbear/lexicons"

[operator]
# Who runs this instance. `email`, `privacy_policy` and `terms_of_service` are
# published through com.atproto.server.describeServer, which defines fields for
# them; the rest is served from /operator.json and shown on the landing page.
name        = "Your Name"
email       = "admin@example.com"
url         = "https://example.com"
support_url = "https://example.com/support"
description = "A personal AT Protocol server."
# privacy_policy   = "https://example.com/privacy"
# terms_of_service = "https://example.com/terms"

# Marks a testing instance. The landing page says so plainly, so nobody
# mistakes the accounts on it for people.
development = false

[identity]
plc_url = "https://plc.directory"

# Hex-encoded secp256k1 private key signing the genesis PLC operation for every
# DID this host mints. Generated and persisted on first start when unset.
# Losing it orphans those DIDs: their operations cannot be updated without it.
# plc_rotation_key = "..."

# Resolved DID documents are cached. Without this, every describeRepo becomes an
# outbound request to the PLC directory — a federating host sees enough AppView
# traffic for that to saturate the worker pool.
did_cache_ttl_seconds = 300
did_cache_entries     = 64

[accounts]
# HTTP Basic 'admin:<password>' for admin endpoints, including invite codes.
# admin_password = "..."

# When true, createAccount requires a valid invite code. Mint one with
# com.atproto.server.createInviteCode, which is admin-authenticated.
invite_required = true

[limits]
# Per-client request budget: requests per window. The historical 100/60 is under
# two requests a second, which one AppView or a relay backfilling with getRepo
# will exceed without being abusive.
rate_limit                = 3000
rate_limit_window_seconds = 60

# Maximum blob upload. 0 removes the cap, which makes an upload path a
# disk-exhaustion lever; the reference uses 5 MB.
blob_upload_bytes = 5242880

[firehose]
# Relays told about new data via requestCrawl on write. Without any, a quiet
# host is never crawled and never federates.
crawlers = ["https://bsky.network"]

# Throttle between announcements.
crawl_notify_seconds = 1200

# Keepalive for idle firehose connections. Must stay well under the tightest
# idle timeout in the proxy path (nginx defaults to 60s), or relays are
# disconnected every minute and never stay attached.
ping_seconds = 20

# Event retention. Pruned events cannot be replayed, and a consumer asking for
# them is answered with #info{OutdatedCursor} rather than a silent gap.
retention_max_age_seconds = 2592000   # 30 days
retention_min_events      = 1000

[appview]
url = "https://api.bsky.app"
did = "did:web:api.bsky.app"

