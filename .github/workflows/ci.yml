name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Facts stated in two places must agree. See tools/check-drift.sh.
  drift:
    name: drift (docs vs code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-drift.sh

  # pdsadmin/metalbear-update.sh against a local release server and a stub
  # binary: checksum, signature, backup, rollback. Needs no network.
  updater:
    name: updater (local release server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/update/test_update.sh

  # The Pi 1B/Zero configuration (#34): METALBEAR_PROFILE=minimal must build,
  # start and answer _health, and the sources using 64-bit atomics must compile
  # for ARMv6Z without needing libatomic. Host x86-64 and a compile-only ARMv6
  # cross-check; neither proves anything about real Pi hardware.
  minimal:
    name: minimal profile + ARMv6 atomics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsqlite3-dev libcurl4-openssl-dev \
            libssl-dev libsecp256k1-dev libmicrohttpd-dev libzstd-dev zlib1g-dev \
            libc-ares-dev libidn2-dev libpcre2-dev gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross

      - name: Configure and build (minimal profile)
        run: |
          cmake -S . -B build-min -DCMAKE_BUILD_TYPE=Debug -DMETALBEAR_PROFILE=minimal
          cmake --build build-min -j"$(nproc)"

      # The whole suite, minus the tests of modules the minimal profile leaves
      # out (those are not built there). The five tests in
      # docs/pi1-hardware-validation.md are among them.
      - name: Tests (minimal profile)
        run: ctest --test-dir build-min --output-on-failure --timeout 120 -j"$(nproc)"

      - name: Smoke test the minimal binary
        run: |
          mkdir -p /tmp/smoke/data
          cat > /tmp/smoke/config.toml <<EOF
          [server]
          listen      = "127.0.0.1"
          port        = 2599
          service_did = "did:web:smoke.example.com"
          public_url  = "http://127.0.0.1:2599"
          user_domain = ".smoke.example.com"
          data        = "/tmp/smoke/data"
          EOF
          METALBEAR_CONFIG=/tmp/smoke/config.toml \
          METALBEAR_LEXICON_DIR=build-min/_deps/wolfram-src/lexicons \
            ./build-min/metalbear &
          PID=$!
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:2599/xrpc/_health >/dev/null && break
          done
          curl -sf http://127.0.0.1:2599/xrpc/_health
          kill $PID

      - name: ARMv6Z atomics (compile-only)
        run: tools/check-armv6-atomics.sh build-min

  # The one status check branch protection requires. It exists so that the
  # required-check list does not have to be edited whenever a job is added:
  # add the job to `needs` here (tools/check-drift.sh fails if you forget).
  gate:
    name: CI gate
    if: always()
    needs: [default, format, drift, updater, minimal]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Skipped, cancelled or failed all fail the gate.
          ok='["success"]'
          echo "$RESULTS" | python3 -c '
          import json, sys
          ok = json.loads(sys.argv[1])
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ok}
          if bad:
              sys.exit(f"gate: not green: {bad}")
          ' "$ok"

  default:
    name: default build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsecp256k1-dev \
            libmicrohttpd-dev \
            libzstd-dev \
            zlib1g-dev \
            libc-ares-dev \
            libidn2-dev \
            libpcre2-dev \

      - name: Clean build directory
        run: rm -rf build

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  # Formatting check: clang-format on changed lines only. The existing tree
  # predates this config and has not been mass-reformatted, so only
  # new/modified lines are required to conform — see .clang-format.
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting of changed files
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable diff base (e.g. first commit on a new branch) — skipping."
            exit 0
          fi
          # Per-file --dry-run --Werror rather than git-clang-format: that
          # wrapper unconditionally calls `clang-format -list-ignored`
          # (added in newer LLVM releases), which crashes silently under
          # `set -e` against an apt-installed clang-format that predates it,
          # failing the job with no diagnostic. The whole tree is fully
          # clang-format-clean as of the repo-wide reformat, so checking a
          # changed file in full is equivalent to checking just its changed
          # lines and needs no wrapper script at all. The version is pinned
          # to clang-format-18 because ubuntu-latest's unpinned clang-format
          # drifts: a newer one re-flags pre-existing lines in files that only
          # picked up a small edit, failing CI on content nobody touched.
          CHANGED="$(git diff --name-only --diff-filter=d "$BASE" -- '*.c' '*.h' '*.cpp' '*.hpp' '*.cc')"
          if [ -z "$CHANGED" ]; then
            echo "No C/C++ files changed."
            exit 0
          fi
          echo "Checking: $CHANGED"
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            clang-format-18 --dry-run --Werror -style=file "$f" || FAIL=1
          done <<< "$CHANGED"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more changed files are not clang-format clean (see errors above). Run: clang-format -i <file>, review, and commit the result."
            exit 1
          fi

      - name: Check CMake formatting (informational)
        continue-on-error: true
        run: |
          pip install --quiet cmakelang
          cmake-format --check CMakeLists.txt || echo "::warning::CMakeLists.txt is not cmake-format clean yet (non-blocking until the tree is reformatted)."

  # Mechanical codebase-health scan (desloppify). Informational only: its
  # score is 75% subjective design review, which needs an LLM in the loop
  # that this workflow doesn't run — so this surfaces the objective/mechanical
  # signal (duplication, dead code, unused imports, security smells) rather
  # than gating merges on an unreviewed score.
  desloppify-scan:
    name: desloppify (mechanical scan, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run mechanical scan
        run: |
          uvx --from git+https://github.com/peteromallet/desloppify.git desloppify scan --path .
          uvx --from git+https://github.com/peteromallet/desloppify.git desloppify status
