# Canonical in ewanc26/metalbear; drift-checked in every repo (tools/repo_sync.py forms check).
name: 'Duplication: move to Wolfram'
description: Logic copied between repos that belongs in Wolfram.
labels:
- refactor
- duplication
body:
- type: markdown
  attributes:
    value: 'Write this in the first person, as the owner: "I''ve found...", "I want...", not "This issue tracks...". If Claude is writing it, the last line is exactly `_Written by Claude on my behalf._`.
      Security problems never go here: use the private advisory link on the new-issue page.'
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Which `area:` label fits. Pick more than one if it spans areas.
    multiple: true
    options:
      # areas:begin (generated from .github/labels.yml; per-repo)
      - atproto
      - auth
      - build
      - ci
      - docs
      - infra
      - ui
      - input
      - storage
      - network
      - media
      - update
      # areas:end
  validations:
    required: true
- type: textarea
  id: copies
  attributes:
    label: The copies
    description: Each repo, file and line range, and whether they already differ.
  validations:
    required: true
- type: textarea
  id: api
  attributes:
    label: The Wolfram API I want
    description: Header, functions, and whether it must build for consoles or C89.
  validations:
    required: true
- type: textarea
  id: vectors
  attributes:
    label: Shared test vectors
    description: What a vectors file under test/vectors/ should cover, so every copy can be checked against it.
  validations:
    required: true
- type: textarea
  id: adoption
  attributes:
    label: Adoption
    description: Which consumers drop their copy, and what they keep.
  validations:
    required: true
