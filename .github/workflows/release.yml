name: Release

# Prebuilt binaries for Linux and macOS, and a multi-architecture container
# image. Three ways in:
#   - push of a vX.Y.Z tag (tools/release.sh tag);
#   - manually with `version` set, run from main: `verify` tags main's head
#     itself with GITHUB_TOKEN, after the same checks, and the rest of this
#     run builds and publishes. For when a tag cannot be pushed from where the
#     release is being cut. It never moves or re-creates an existing tag;
#   - manually with `version` empty: a dry run that builds and uploads
#     artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release X.Y.Z from the head of main (empty: dry run)'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # Gate for everything below. A tag is only releasable if it is vX.Y.Z, equals
  # the VERSION in CMakeLists.txt, points at a commit on main, and `CI gate`
  # passed on that commit. tools/release.sh produces such tags; this refuses
  # one made any other way. A manual dry run has no tag, so the checks that
  # need one are skipped.
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create the tag on a dispatch release
      checks: read
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      tag: ${{ steps.which.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # What is being released: the pushed tag, or the one this run will
      # create from `version`. Empty on a dry run.
      - name: Which tag
        id: which
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$VERSION_INPUT" ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::a release by dispatch must run from main, not $GITHUB_REF"; exit 1; }
            tag="v${VERSION_INPUT#v}"
          fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

      - name: Tag matches the CMake version, has a changelog section, is on main
        if: steps.which.outputs.tag != ''
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1; }
          version="$(awk '/^project\(/,/\)[[:space:]]*$/' CMakeLists.txt \
            | sed -n 's/.*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG but CMakeLists.txt VERSION is $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      - name: CI gate passed on the tagged commit
        if: steps.which.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI gate")] | map(.conclusion) | .[0] // "missing"')"
          [ "$state" = success ] || { echo "::error::'CI gate' on $GITHUB_SHA is '$state'"; exit 1; }

      # Dispatch only: create the annotated tag at this commit. Refuses if the
      # tag already exists anywhere; a wrong release gets a new patch.
      - name: Create the tag (dispatch only)
        if: github.event_name == 'workflow_dispatch' && steps.which.outputs.tag != ''
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; not re-tagging"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # `latest` moves only to the newest stable release. A patch cut for an
      # older minor gets its version and minor tags, never `latest`.
      - name: Is this the newest release?
        id: latest
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          newest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -n "$TAG" ] && [ "$TAG" = "$newest" ]; then echo latest=true; else echo latest=false; fi | tee -a "$GITHUB_OUTPUT"

  binaries:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            os: linux
            arch: x86_64
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          # Apple silicon only. The Intel target ran on macos-13, the last
          # x86_64 image, which now queues for hours or never picks up a runner
          # at all and held whole releases behind it. Rosetta 2 runs Intel
          # binaries on Apple silicon and not the reverse, so an Intel Mac
          # builds from source.
          - name: macos-arm64
            runs-on: macos-15
            os: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          path: MetalBear

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev \
            libsecp256k1-dev libmicrohttpd-dev libzstd-dev \
            zlib1g-dev libc-ares-dev libidn2-dev libpcre2-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          # c-ares explicitly: some formula on the runner ships libcares.pc
          # without the library, so pkg-config finds the module and the link
          # then fails. Installing it makes the detection consistent rather
          # than accidental.
          brew install cmake openssl@3 sqlite libmicrohttpd secp256k1 zstd c-ares pcre2

      - name: Build
        working-directory: MetalBear
        run: |
          # Static internal libraries so the artifact is one file rather than a
          # binary plus four shared objects that must stay in step with it.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DMETALBEAR_BUILD_TESTS=OFF
          # Only the binary this release ships. Building `all` also builds
          # Wolfram's own CLI, which links c-ares and so failed the macOS build
          # on a dependency nothing in the artifact uses.
          cmake --build build --parallel --target metalbear

      - name: Smoke test the binary
        working-directory: MetalBear
        run: |
          # A binary that cannot answer _health is not worth shipping, and a
          # link error against the wrong library only shows up at runtime.
          mkdir -p /tmp/smoke/data
          cat > /tmp/smoke/config.toml <<EOF
          [server]
          listen      = "127.0.0.1"
          port        = 2599
          service_did = "did:web:smoke.example.com"
          public_url  = "http://127.0.0.1:2599"
          user_domain = ".smoke.example.com"
          data        = "/tmp/smoke/data"
          EOF
          METALBEAR_CONFIG=/tmp/smoke/config.toml \
          METALBEAR_LEXICON_DIR=${{ github.workspace }}/MetalBear/build/_deps/wolfram-src/lexicons \
            ./build/metalbear &
          PID=$!
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:2599/xrpc/_health >/dev/null && break
          done
          curl -sf http://127.0.0.1:2599/xrpc/_health || { echo "no response"; exit 1; }
          echo "healthy: $(curl -s http://127.0.0.1:2599/xrpc/_health)"
          kill $PID || true

      - name: Package
        run: |
          NAME=metalbear-${{ matrix.name }}
          mkdir -p "dist/$NAME"
          cp MetalBear/build/metalbear "dist/$NAME/"
          cp MetalBear/config.example.toml "dist/$NAME/"
          cp MetalBear/README.md MetalBear/LICENSE "dist/$NAME/" 2>/dev/null || true
          # Records are validated against this corpus; without it every write is
          # stored unchecked and reported as validationStatus "unknown".
          cp -R MetalBear/build/_deps/wolfram-src/lexicons "dist/$NAME/lexicons"

          cat > "dist/$NAME/RUNNING.md" <<'EOF'
          # Running this build

          MetalBear links the system's TLS, HTTP, SQLite and crypto libraries,
          so those must be present:

              Debian/Ubuntu  apt install libsqlite3-0 libcurl4 libssl3 \
                                 libsecp256k1-1 libmicrohttpd12 libzstd1 zlib1g
              macOS          brew install openssl@3 sqlite libmicrohttpd \
                                 secp256k1 zstd

          Copy `config.example.toml` to `config.toml`, set at least
          `service_did` and `user_domain`, then:

              METALBEAR_LEXICON_DIR=./lexicons ./metalbear

          MetalBear does not terminate TLS. Bind it to loopback and put a
          reverse proxy in front, forwarding WebSocket upgrades — without those
          the firehose will not serve and the host will never federate.
          EOF

          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: metalbear-${{ matrix.name }}
          path: |
            metalbear-${{ matrix.name }}.tar.gz
            metalbear-${{ matrix.name }}.tar.gz.sha256

  image:
    name: image (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian, glibc. The default: what `:latest` and a bare version tag
          # point at.
          - name: debian
            file: MetalBear/Dockerfile
            target: runtime
            platforms: linux/amd64,linux/arm64
            suffix: ''
          # Alpine, musl. Roughly a quarter the size, at the cost of a
          # different resolver and smaller default stacks.
          - name: alpine
            file: MetalBear/Dockerfile.alpine
            target: runtime
            platforms: linux/amd64,linux/arm64,linux/arm/v7
            suffix: '-alpine'
          # Toolchain, sources and the test suite, for poking at the server
          # without setting up a build host.
          - name: dev
            file: MetalBear/Dockerfile
            target: dev
            platforms: linux/amd64,linux/arm64
            suffix: '-dev'

    steps:
      - uses: actions/checkout@v7
        with:
          path: MetalBear

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          # The exact version and the minor; `latest` only for the newest
          # stable release (see verify). Suffixes give -alpine and -dev.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest == 'true' }}
            type=sha,enable=${{ needs.verify.outputs.tag == '' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=MetalBear${{ matrix.suffix }}
            org.opencontainers.image.description=AT Protocol Personal Data Server written in C, built on Wolfram

      # A published version tag is never moved to a new digest. If one
      # exists the release is wrong somewhere; cut a new patch instead.
      - name: Refuse to overwrite a published version
        if: needs.verify.outputs.tag != ''
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          ref="ghcr.io/${{ github.repository }}:${TAG#v}${{ matrix.suffix }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::$ref already exists; not overwriting it"
            exit 1
          fi
          echo "$ref is new"

      # The multi-platform build below only pushes; buildx cannot --load a
      # multi-arch manifest, so nothing before this ever actually ran the
      # image it ships. A binary that starts on the runner (the "binaries"
      # job's smoke test builds it separately, outside any container) can
      # still fail to start inside the image if the image is missing a
      # runtime dependency the binary needs — neither runtime image's apt/
      # apk list installed libstdc++/libgcc_s, and that went unnoticed for
      # three releases because nothing ran the container before shipping it.
      # Build once, single native platform, load it locally, and actually
      # run it.
      - name: Smoke test the container
        if: matrix.target == 'runtime'
        run: |
          docker buildx build \
            --load \
            -f "${{ matrix.file }}" \
            --target "${{ matrix.target }}" \
            -t smoke-test:${{ matrix.name }} \
            .
          docker run -d --name smoke-${{ matrix.name }} -p 12583:2583 \
            -e METALBEAR_SERVICE_DID=did:web:smoke.example.com \
            -e METALBEAR_PUBLIC_URL=http://127.0.0.1:12583 \
            -e METALBEAR_USER_DOMAIN=.smoke.example.com \
            smoke-test:${{ matrix.name }}
          ok=
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:12583/xrpc/_health >/dev/null && { ok=1; break; }
          done
          if [ -z "$ok" ]; then
            echo "container never answered _health"
            docker logs smoke-${{ matrix.name }}
            exit 1
          fi
          echo "healthy: $(curl -s http://127.0.0.1:12583/xrpc/_health)"
          docker rm -f smoke-${{ matrix.name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # The context is the parent directory holding the MetalBear checkout,
          # the layout the Dockerfiles expect. Wolfram is fetched by CMake's
          # FetchContent inside the build (see CMakeLists.txt), so no separate
          # checkout is needed and the SDK always builds from the pinned tag.
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ needs.verify.outputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Pull what was actually pushed, by digest, and run it. This is the
      # published image, not the local smoke-test build above.
      - name: Pull the published image and check _health
        if: needs.verify.outputs.tag != '' && matrix.target == 'runtime'
        run: |
          ref="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          docker inspect --format '{{ json .Config.Labels }}' "$ref"
          docker run -d --name pulled -p 12584:2583 \
            -e METALBEAR_SERVICE_DID=did:web:smoke.example.com \
            -e METALBEAR_PUBLIC_URL=http://127.0.0.1:12584 \
            -e METALBEAR_USER_DOMAIN=.smoke.example.com \
            "$ref"
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:12584/xrpc/_health && break
          done
          curl -sf http://127.0.0.1:12584/xrpc/_health || { docker logs pulled; exit 1; }
          docker rm -f pulled

      - name: Record the digest
        if: needs.verify.outputs.tag != ''
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p digests
          printf '| `%s` | `%s` | %s |\n' \
            "${TAG#v}${{ matrix.suffix }}" \
            "${{ steps.build.outputs.digest }}" \
            "${{ matrix.platforms }}" > "digests/${{ matrix.name }}.md"

      - uses: actions/upload-artifact@v7
        if: needs.verify.outputs.tag != ''
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.md

  release:
    name: publish release
    needs: [verify, binaries, image]
    if: needs.verify.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      # docker/metadata-action's `type=semver,pattern={{version}}` tag (what
      # the image job actually pushes) strips the tag's leading `v` —
      # `v0.13.6` pushes as `0.13.6`, not `v0.13.6`. The release body's pull
      # command used to reference `github.ref_name` directly, which docker
      # pull would then fail to resolve.
      - name: Compute image tag
        id: tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Only the named binary artifacts. The image job's buildx runs upload
      # *.dockerbuild attestation artifacts that repeatedly fail to download
      # here and have been taking every tag release down with them.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: metalbear-*
          merge-multiple: true

      # The updater's inputs (pdsadmin/metalbear-update.sh): one SHA256SUMS
      # covering every archive, and, when the owner has provided a signing
      # key, a detached OpenSSH signature over it. The key is a repository
      # secret supplied by the owner; this step never generates one and never
      # prints it. Without the secret the release ships unsigned and the
      # updater runs in SHA-256-only mode.
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd artifacts
          cat metalbear-*.tar.gz.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            umask 077
            keyfile="$(mktemp)"
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
            ssh-keygen -q -Y sign -f "$keyfile" -n file SHA256SUMS
            rm -f "$keyfile"
            echo "signed SHA256SUMS"
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set; publishing SHA256SUMS unsigned"
          fi

      - uses: actions/checkout@v7
        with:
          path: MetalBear

      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      # Notes: this version's CHANGELOG section (in my words), then the image
      # digests and what each archive is for.
      - name: Release notes
        run: |
          v="${{ steps.tag.outputs.version }}"
          {
            awk -v v="$v" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' MetalBear/CHANGELOG.md
            cat <<EOF

          ## Container image

          \`\`\`sh
          docker pull ghcr.io/${{ github.repository }}:$v
          \`\`\`

          | Tag | Digest | Platforms |
          | --- | --- | --- |
          EOF
            cat digests/*.md
            cat <<'EOF'

          There is no image for the Raspberry Pi 1B or Zero (ARMv6): build from
          source with the minimal profile, see docs/pi1-hardware-validation.md.
          The Alpine image's `linux/arm/v7` covers 32-bit ARMv7 boards only.

          ## Binaries

          Prebuilt for Linux (x86_64, aarch64) and macOS (arm64). Each archive
          holds the binary, the lexicon corpus records are validated against,
          an example configuration, and a note on the runtime libraries it
          expects. `SHA256SUMS` covers every archive and is what
          `pdsadmin/metalbear-update.sh` checks. There is no Intel macOS build.

          MetalBear does not terminate TLS: bind it to loopback and put a
          reverse proxy in front, forwarding WebSocket upgrades.
          EOF
          } | sed 's/^          //' > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: notes.md
          generate_release_notes: true
