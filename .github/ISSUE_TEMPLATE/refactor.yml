# Canonical in ewanc26/metalbear; drift-checked in every repo (tools/repo_sync.py forms check).
name: Refactor
description: Restructuring with no change in behaviour.
labels:
- refactor
body:
- type: markdown
  attributes:
    value: 'Write this in the first person, as the owner: "I''ve found...", "I want...", not "This issue tracks...". If Claude is writing it, the last line is exactly `_Written by Claude on my behalf._`.
      Security problems never go here: use the private advisory link on the new-issue page.'
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Which `area:` label fits. Pick more than one if it spans areas.
    multiple: true
    options:
      # areas:begin (generated from .github/labels.yml; per-repo)
      - atproto
      - auth
      - build
      - ci
      - docs
      - infra
      - ui
      - input
      - storage
      - network
      - media
      - update
      # areas:end
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What I want to restructure
    description: Files, modules or types.
  validations:
    required: true
- type: textarea
  id: why
  attributes:
    label: Why
    description: What the current shape costs.
  validations:
    required: true
- type: textarea
  id: safety
  attributes:
    label: How I'll know nothing changed
    description: The tests that pin current behaviour, or the ones to add first.
  validations:
    required: true
