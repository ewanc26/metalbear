# Canonical in ewanc26/metalbear; drift-checked in every repo (tools/repo_sync.py forms check).
name: Needs the owner
description: 'Something only the owner can supply: a credential, a hardware result, a decision, money or an irreversible action.'
labels:
- chore
- needs-owner
body:
- type: markdown
  attributes:
    value: 'Write this in the first person, as the owner: "I''ve found...", "I want...", not "This issue tracks...". If Claude is writing it, the last line is exactly `_Written by Claude on my behalf._`.
      Security problems never go here: use the private advisory link on the new-issue page.'
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Which `area:` label fits. Pick more than one if it spans areas.
    multiple: true
    options:
      # areas:begin (generated from .github/labels.yml; per-repo)
      - atproto
      - auth
      - build
      - ci
      - docs
      - infra
      - ui
      - input
      - storage
      - network
      - media
      - update
      # areas:end
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: What's needed
    options:
    - A credential or secret
    - A hardware result
    - A decision
    - A repository setting
    - Money or an irreversible action
  validations:
    required: true
- type: textarea
  id: ask
  attributes:
    label: Exactly what I need
    description: 'Concrete enough to do in one sitting: the command, the setting, the test on the device.'
  validations:
    required: true
- type: textarea
  id: blocked
  attributes:
    label: What it blocks
    description: Issues and PRs waiting on it, and what carries on meanwhile.
  validations:
    required: true
