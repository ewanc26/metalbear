# Canonical in ewanc26/metalbear; drift-checked in every repo (tools/repo_sync.py forms check).
name: Test
description: Missing, wrong or flaky test coverage.
labels:
- test
body:
- type: markdown
  attributes:
    value: 'Write this in the first person, as the owner: "I''ve found...", "I want...", not "This issue tracks...". If Claude is writing it, the last line is exactly `_Written by Claude on my behalf._`.
      Security problems never go here: use the private advisory link on the new-issue page.'
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Which `area:` label fits. Pick more than one if it spans areas.
    multiple: true
    options:
      # areas:begin (generated from .github/labels.yml; per-repo)
      - atproto
      - auth
      - build
      - ci
      - docs
      - infra
      - ui
      - input
      - storage
      - network
      - media
      - update
      # areas:end
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What isn't covered
    description: The behaviour, function or path.
  validations:
    required: true
- type: textarea
  id: how
  attributes:
    label: How to test it
    description: Offline seam, fixture or vector; host, emulator or hardware.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Evidence of flakiness
    description: 'If it is flaky: CI run links and how often.'
  validations:
    required: false
