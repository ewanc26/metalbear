name: Flow checks

# Reusable: `uses: ./.github/workflows/flow-checks.yml` from a pull_request
# workflow. Self-contained apart from tools/flow-check.sh, so Wolfram can host
# both files and the rest of the stack can call or copy them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  flow:
    name: flow (branch, title, body, commits)
    # Only a pull request has a branch, title and body to check. On a push to
    # main the flow was already enforced when the PR merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the pull request against the written flow
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/flow-check.sh
