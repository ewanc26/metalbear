version: 2
# Dependabot version-update config for metalbear.
#
# A 7-day cooldown lets newly published releases age so compromised
# versions are usually yanked before we adopt them. Security updates
# are never delayed. Auto-merge is intentionally disabled.

updates:
  - package-ecosystem: npm
    directories:
      - "/admin-mobile"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Explicit labels stop Dependabot from creating its own defaults
    # (dependencies, javascript), which are not in .github/labels.yml and
    # fail flow / labels and metadata. Keep these in the canonical taxonomy.
    labels:
      - chore
      - "area: ui"
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # github_actions is a Dependabot default, not a label in the canonical
    # taxonomy; use existing labels so the repository stays drift-free.
    labels:
      - chore
      - "area: ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
