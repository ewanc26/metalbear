  description: Linux, macOS and Windows hosts
- name: 'platform: wii'
  color: 5319e7
  description: Nintendo Wii
- name: 'platform: wiiu'
  color: 5319e7
  description: Nintendo Wii U
- name: 'platform: 3ds'
  color: 5319e7
  description: Nintendo 3DS
- name: 'platform: macos9'
  color: 5319e7
  description: Classic Mac OS 9
