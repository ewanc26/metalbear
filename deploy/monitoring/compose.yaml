name: metalbear-monitoring

# Optional monitoring stack for a self-hosted MetalBear. Start it with:
#
#   docker compose -f deploy/monitoring/compose.yaml up --detach
#
# All services use host networking and bind to 127.0.0.1, so nothing is exposed
# to the internet. Reach Grafana through an SSH tunnel. The stack scrapes
# MetalBear's admin-gated /metrics endpoint; put the admin password in the file
# named by METALBEAR_METRICS_PASSWORD_FILE (default below) with mode 0600.
# That file stays on the host and is never part of this repository.

services:
  node-exporter:
    container_name: metalbear-node-exporter
    image: prom/node-exporter:v1
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)'
      - '--web.listen-address=127.0.0.1:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  prometheus:
    container_name: metalbear-prometheus
    image: prom/prometheus:v3
    network_mode: host
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.listen-address=127.0.0.1:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${METALBEAR_METRICS_PASSWORD_FILE:-/etc/metalbear/metrics-password}:/etc/prometheus/metrics-password:ro
      - prometheus-data:/prometheus

  grafana:
    container_name: metalbear-grafana
    # Grafana publishes no floating major tag; pin an exact version.
    image: grafana/grafana:13.1.3
    network_mode: host
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3001
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
